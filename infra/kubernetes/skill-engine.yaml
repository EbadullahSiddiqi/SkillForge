apiVersion: apps/v1
kind: Deployment
metadata:
  name: skill-engine
  namespace: skillforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: skill-engine
  template:
    metadata:
      labels:
        app: skill-engine
    spec:
      containers:
        - name: skill-engine
          image: <YOUR_REGISTRY>/skillforge-skill-engine:latest
          ports:
            - containerPort: 8000
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: skill-engine
  namespace: skillforge
spec:
  selector:
    app: skill-engine
  ports:
    - port: 8000
      targetPort: 8000

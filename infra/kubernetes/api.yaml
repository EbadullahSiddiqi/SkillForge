apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: skillforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: <YOUR_REGISTRY>/skillforge-api:latest
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: skillforge-secrets
          env:
            - name: AI_SERVICE_URL
              value: "http://rag-service:5001"
            - name: SKILL_ENGINE_URL
              value: "http://skill-engine:8000"
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: skillforge
spec:
  selector:
    app: api
  ports:
    - port: 5000
      targetPort: 5000

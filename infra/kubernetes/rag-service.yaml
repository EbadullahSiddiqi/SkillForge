apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-service
  namespace: skillforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rag-service
  template:
    metadata:
      labels:
        app: rag-service
    spec:
      containers:
        - name: rag-service
          image: <YOUR_REGISTRY>/skillforge-rag-service:latest
          ports:
            - containerPort: 5001
          envFrom:
            - secretRef:
                name: skillforge-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: rag-service
  namespace: skillforge
spec:
  selector:
    app: rag-service
  ports:
    - port: 5001
      targetPort: 5001

apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: skillforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: <YOUR_REGISTRY>/skillforge-web:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://api:5000"
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: skillforge
spec:
  selector:
    app: web
  ports:
    - port: 3000
      targetPort: 3000
  type: LoadBalancer

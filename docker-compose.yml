services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: ./apps/api
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/skillforge
      AI_SERVICE_URL: http://ai:5001
    depends_on:
      - mongo
      - ai

  ai:
    build:
      context: ./services/ai
    ports:
      - "5001:5001"
    environment:
      MONGODB_URI: mongodb://mongo:27017/skillforge
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      - mongo

  web:
    build:
      context: ./apps/web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
    depends_on:
      - api

volumes:
  mongo_data:
